<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAST V3 Live</title>
<style>
:root{--bg:#050a12;--surface:#0a1420;--surface-2:#0d1a2a;--border:#1a2a3e;--text:#e6edf5;--text-dim:#8b96a8;--accent:#22ff88}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh}
.sport-pill{font-size:11px;font-weight:600;padding:6px 12px;border-radius:9999px;cursor:pointer;border:none}
.sport-pill.active{background:white;color:black}
.sport-pill.inactive{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border)}
.generate-btn{background:var(--accent);color:black;border:none;border-radius:9999px;padding:0 20px;height:36px;font-weight:800;font-size:12px;cursor:pointer}
.glass{background:rgba(10,20,32,0.8);border:1px solid var(--border);border-radius:14px;padding:16px}
.agent-card{border-radius:18px;padding:14px;background:var(--surface);border:1px solid var(--border)}
.slip-card{border-radius:22px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
.pick-row{border-bottom:1px solid rgba(26,42,62,0.6)}
</style></head><body>
<header style="position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);background:rgba(5,10,18,0.9);padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
<div style="display:flex;align-items:center;gap:12px"><div style="height:36px;width:36px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:black;font-weight:900">PF</div><div><div style="font-weight:800">PropsForge BEAST V3 LIVE</div><div style="font-size:10px;color:var(--text-dim)">12-AGENT LIVE API</div></div><span style="margin-left:16px;font-size:11px;color:var(--text-dim)">LIVE <span id="liveSport">NBA</span> • <span id="liveTime"></span></span></div>
<div style="display:flex;gap:8px;align-items:center"><div style="display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:9999px;padding:4px">
<button onclick="setSport('NBA')" id="pill-NBA" class="sport-pill active">NBA</button>
<button onclick="setSport('NFL')" id="pill-NFL" class="sport-pill inactive">NFL</button>
<button onclick="setSport('MLB')" id="pill-MLB" class="sport-pill inactive">MLB</button>
<button onclick="setSport('NHL')" id="pill-NHL" class="sport-pill inactive">NHL</button>
</div><button onclick="generateSlips()" id="genBtn" class="generate-btn">GENERATE SLIPS</button></div>
</header>
<main style="max-width:1600px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:20px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div class="glass"><div style="font-size:10px;color:var(--text-dim)">TODAY'S EDGE</div><div style="font-size:22px;font-weight:700;margin-top:8px" id="edgeVal">--</div><div style="font-size:11px;color:var(--text-dim);margin-top:4px"><span id="ppCount">--</span> PP • <span id="oddsCount">--</span> Odds</div></div>
<div class="glass"><div style="font-size:10px;color:var(--text-dim)">12 AGENTS</div><div style="font-size:18px;font-weight:700;margin-top:8px">ALL LIVE</div><div style="font-size:11px;color:var(--accent)">Verified live</div></div>
<div class="glass"><div style="font-size:10px;color:var(--text-dim)">SPORT</div><div style="font-size:18px;font-weight:700;margin-top:8px" id="currentSport">NBA</div><div style="font-size:11px;color:var(--text-dim)" id="sportInfo">--</div></div>
<div class="glass"><div style="font-size:10px;color:var(--text-dim)">STATUS</div><div style="font-size:14px;font-weight:700;margin-top:8px" id="statusText">READY</div><div style="font-size:11px;color:var(--text-dim)" id="statusSub">Click Generate</div></div>
</div>
<div style="display:flex;gap:20px;flex-wrap:wrap">
<div style="flex:1;min-width:300px"><h2 style="font-size:12px;color:var(--text-dim);margin-bottom:12px">12 AGENTS</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px" id="agentsGrid"></div></div>
<div style="flex:2;min-width:400px"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h2 style="font-size:12px;color:var(--text-dim)">SLIP OUTPUT • <span id="outputSport">NBA</span></h2><div id="slipTabs" style="display:flex;gap:4px"></div></div><div id="slipOutput" class="slip-card"><div style="padding:40px;text-align:center;color:var(--text-dim)">Click GENERATE to pull live <span id="genSport">NBA</span> lines</div></div></div>
</div>
</main>
<script>
let currentSport='NBA',currentSlips=[],activeSlip=0;
const agents=[{id:1,name:"Market Scanner"},{id:2,name:"Injury Intel"},{id:3,name:"Lineup Lab"},{id:4,name:"Matchup Model"},{id:5,name:"Form Tracker"},{id:6,name:"History Engine"},{id:7,name:"Context Agent"},{id:8,name:"Edge Calculator"},{id:9,name:"Correlation Engine"},{id:10,name:"Risk Manager"},{id:11,name:"Slip Builder"},{id:12,name:"Validator"}];
function renderAgents(s){document.getElementById('agentsGrid').innerHTML=agents.map(a=>`<div class="agent-card"><div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px"><div style="height:28px;width:28px;border-radius:8px;background:#122032;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800">${a.id}</div><div><div style="font-size:11px;font-weight:700">${a.name}</div><div style="font-size:9px;color:var(--text-dim)">Live</div></div></div><div style="height:6px;width:6px;border-radius:50%;background:${s==='done'?'var(--accent)':s==='running'?'#ffb02e':'var(--border)'}"></div></div><div style="margin-top:8px;font-size:9px;padding:2px 6px;border-radius:9999px;background:${s==='done'?'rgba(34,255,136,0.1)':'#122032'};display:inline-block">${s==='done'?'LIVE DONE':s==='running'?'RUNNING':'IDLE'}</div></div>`).join('');}
function setSport(s){currentSport=s;document.getElementById('currentSport').textContent=s;document.getElementById('outputSport').textContent=s;document.getElementById('genSport').textContent=s;document.getElementById('liveSport').textContent=s;['NBA','NFL','MLB','NHL'].forEach(x=>{document.getElementById('pill-'+x).className=x===s?'sport-pill active':'sport-pill inactive'});currentSlips=[];document.getElementById('slipOutput').innerHTML=`<div style="padding:40px;text-align:center;color:var(--text-dim)">Sport changed to ${s} - Click GENERATE for live ${s} lines</div>`;fetchLiveStatus();}
async function fetchLiveStatus(){try{const r=await fetch(`/api/v1/live-status?sport=${currentSport}`);const d=await r.json();if(d.prizepicks_live!==undefined){document.getElementById('ppCount').textContent=d.prizepicks_live;document.getElementById('oddsCount').textContent=d.odds_api_live;document.getElementById('sportInfo').textContent=`${d.prizepicks_live} lines`;}}catch(e){}}
async function generateSlips(){const btn=document.getElementById('genBtn');btn.disabled=true;btn.textContent='FORGING...';document.getElementById('statusText').textContent='RUNNING';renderAgents('running');document.getElementById('slipOutput').innerHTML=`<div style="padding:40px;text-align:center">Scanning live ${currentSport}...</div>`;try{const r=await fetch('/api/v1/generate-slips-live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sport:currentSport})});const data=await r.json();currentSlips=data.slips||[];activeSlip=0;document.getElementById('ppCount').textContent=data.live_breakdown?.prizepicks_live||0;document.getElementById('oddsCount').textContent=data.live_breakdown?.odds_api_live||0;document.getElementById('edgeVal').textContent=currentSlips.length>0?`+${currentSlips[0].total_edge}%`:'--';renderAgents('done');document.getElementById('statusText').textContent='DONE';document.getElementById('statusSub').textContent=`${data.live_breakdown?.prizepicks_live} ${currentSport} lines`;renderSlips();}catch(e){document.getElementById('slipOutput').innerHTML=`Error: ${e.message}`;renderAgents('idle');}btn.disabled=false;btn.textContent='GENERATE SLIPS';}
function renderSlips(){if(!currentSlips.length){document.getElementById('slipOutput').innerHTML=`<div style="padding:20px;text-align:center">No live lines for ${currentSport} right now - Try NBA (most lines)</div>`;return;}const tabs=document.getElementById('slipTabs');tabs.innerHTML=currentSlips.map((s,i)=>`<button onclick="activeSlip=${i};renderSlips()" style="font-size:11px;padding:6px 12px;border-radius:9999px;border:none;cursor:pointer;background:${i===activeSlip?'white':'transparent'};color:${i===activeSlip?'black':'#8b96a8'}">${s.slip_id} +${s.total_edge}%</button>`).join('');const slip=currentSlips[activeSlip];let html=`<div style="padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface-2)"><div><div style="font-weight:700">${slip.slip_id} <span style="font-size:10px;padding:2px 6px;border-radius:9999px;background:#ffb02e22;color:#ffb02e">${slip.sport} ${slip.picks.length} picks</span></div><div style="font-size:11px;color:var(--text-dim)">${currentSport} Live</div></div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:11px;color:var(--text-dim)">Edge</span><span style="font-weight:800;color:var(--accent)">+${slip.total_edge}%</span></div></div><table style="width:100%;border-collapse:collapse"><thead><tr style="font-size:10px;color:var(--text-dim);border-bottom:1px solid var(--border)"><th style="text-align:left;padding:12px 20px">Player</th><th>Market</th><th>Line</th><th>Pick</th><th>Book</th><th>Edge</th></tr></thead><tbody>`;slip.picks.forEach(p=>{html+=`<tr class="pick-row"><td style="padding:14px 20px"><div style="display:flex;gap:8px"><div style="height:28px;width:28px;border-radius:50%;background:#122032;display:flex;align-items:center;justify-content:center;font-size:10px">${p.team||'--'}</div><div><div style="font-size:13px;font-weight:600">${p.player}</div><div style="font-size:10px;color:var(--text-dim)">${p.team} ${p.sport}</div></div></div></td><td style="padding:12px;font-size:12px">${p.market}</td><td style="padding:12px;font-weight:600">${p.line}</td><td style="padding:12px"><span style="font-size:11px;padding:4px 8px;border-radius:9999px;background:var(--accent);color:black;font-weight:700">${p.pick}</span></td><td style="padding:12px;font-size:11px">${p.book}</td><td style="padding:12px;color:var(--accent);font-weight:700">+${p.edge}%</td></tr>`});html+=`</tbody></table>`;document.getElementById('slipOutput').innerHTML=html;}
renderAgents('idle');fetchLiveStatus();setInterval(()=>{document.getElementById('liveTime').textContent=new Date().toLocaleTimeString([],{hour12:false})},1000);
</script></body></html>
