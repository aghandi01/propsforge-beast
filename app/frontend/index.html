<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAST V3 6 Sport Live</title>
<style>
:root{--bg:#050a12;--surface:#0a1420;--surface-2:#0d1a2a;--border:#1a2a3e;--text:#e6edf5;--dim:#8b96a8;--accent:#22ff88}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh}
.pill{font-size:11px;font-weight:700;padding:6px 14px;border-radius:9999px;cursor:pointer;border:1px solid transparent}
.pill.active{background:#fff;color:#000}.pill.inactive{background:var(--surface-2);color:var(--dim);border-color:var(--border)}
.btn-generate{background:var(--accent);color:#000;border:none;border-radius:9999px;height:36px;padding:0 18px;font-weight:800;font-size:12px;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px}
.agent{border-radius:16px;padding:12px;background:var(--surface);border:1px solid var(--border)}
</style></head><body>
<header style="position:sticky;top:0;background:rgba(5,10,18,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
<div style="display:flex;gap:12px;align-items:center"><div style="height:36px;width:36px;border-radius:12px;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-weight:900">PF</div><div><div style="font-weight:800">PropsForge BEAST LIVE</div><div style="font-size:10px;color:var(--dim)">6 SPORTS • 12 AGENTS • LIVE</div></div></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div style="display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:9999px;padding:4px">
<button onclick="setSport('NBA')" id="pill-NBA" class="pill active">NBA</button>
<button onclick="setSport('NFL')" id="pill-NFL" class="pill inactive">NFL</button>
<button onclick="setSport('MLB')" id="pill-MLB" class="pill inactive">MLB</button>
<button onclick="setSport('NHL')" id="pill-NHL" class="pill inactive">NHL</button>
<button onclick="setSport('CFB')" id="pill-CFB" class="pill inactive">CFB</button>
<button onclick="setSport('WNBA')" id="pill-WNBA" class="pill inactive">WNBA</button>
</div><button onclick="generate()" id="genBtn" class="btn-generate">GENERATE</button></div>
</header>
<main style="max-width:1600px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div class="card"><div style="font-size:10px;color:var(--dim)">EDGE</div><div style="font-size:22px;font-weight:800;margin-top:6px" id="edgeVal">--</div><div style="font-size:11px;color:var(--dim)"><span id="ppCount">--</span> PP • <span id="oddsCount">--</span> Odds</div></div>
<div class="card"><div style="font-size:10px;color:var(--dim)">12 AGENTS</div><div style="font-size:18px;font-weight:800;margin-top:6px">ALL LIVE</div><div style="font-size:11px;color:var(--accent)">Verified</div></div>
<div class="card"><div style="font-size:10px;color:var(--dim)">SPORT</div><div style="font-size:18px;font-weight:800;margin-top:6px" id="currentSport">NBA</div><div style="font-size:11px;color:var(--dim)" id="sportDetail">Loading</div></div>
<div class="card"><div style="font-size:10px;color:var(--dim)">STATUS</div><div style="font-size:14px;font-weight:800;margin-top:6px" id="statusText">READY</div><div style="font-size:11px;color:var(--dim)" id="statusSub">Click Generate</div></div>
</div>
<div style="display:flex;gap:16px;flex-wrap:wrap">
<div style="flex:1;min-width:300px"><div style="font-size:11px;color:var(--dim);margin-bottom:10px">12 AGENTS</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="agentsGrid"></div></div>
<div style="flex:2;min-width:400px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="font-size:11px;color:var(--dim)">SLIP OUTPUT • <span id="outputSport">NBA</span></span><div id="slipTabs" style="display:flex;gap:4px"></div></div><div id="slipOutput" class="card" style="border-radius:22px;overflow:hidden"><div style="padding:40px;text-align:center;color:var(--dim)">Click GENERATE for live <span id="genSport">NBA</span></div></div></div>
</div>
</main>
<script>
let cur='NBA',slips=[],active=0;
const agents=[{id:1,n:"Market Scanner"},{id:2,n:"Injury Intel"},{id:3,n:"Lineup Lab"},{id:4,n:"Matchup"},{id:5,n:"Form"},{id:6,n:"History"},{id:7,n:"Context"},{id:8,n:"Edge"},{id:9,n:"Corr"},{id:10,n:"Risk"},{id:11,n:"Slip Builder"},{id:12,n:"Validator"}];
function renderAgents(s){document.getElementById('agentsGrid').innerHTML=agents.map(a=>`<div class="agent"><div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px"><div style="height:24px;width:24px;border-radius:6px;background:#122032;display:flex;align-items:center;justify-content:center;font-size:10px">${a.id}</div><div><div style="font-size:11px;font-weight:700">${a.n}</div><div style="font-size:9px;color:var(--dim)">Live</div></div></div><div style="height:6px;width:6px;border-radius:50%;background:${s==='done'?'var(--accent)':s==='running'?'#ffb02e':'var(--border)'}"></div></div><div style="margin-top:6px"><span style="font-size:9px;padding:2px 6px;border-radius:9999px;background:${s==='done'?'rgba(34,255,136,0.1)':'#122032'};color:${s==='done'?'var(--accent)':'var(--dim)'}">${s==='done'?'LIVE DONE':s==='running'?'RUNNING':'IDLE'}</span></div></div>`).join('');}
function setSport(s){cur=s;['NBA','NFL','MLB','NHL','CFB','WNBA'].forEach(x=>{const el=document.getElementById('pill-'+x);if(el)el.className=x===s?'pill active':'pill inactive'});['currentSport','outputSport','genSport'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=s});slips=[];document.getElementById('slipOutput').innerHTML=`<div style="padding:40px;text-align:center;color:var(--dim)">Sport ${s} - Click GENERATE</div>`;fetchStatus();}
async function fetchStatus(){try{const r=await fetch('/api/v1/live-status?sport='+cur);const d=await r.json();document.getElementById('ppCount').textContent=d.prizepicks_live;document.getElementById('oddsCount').textContent=d.odds_api_live;document.getElementById('sportDetail').textContent=d.prizepicks_live+' lines';}catch(e){}}
async function generate(){const btn=document.getElementById('genBtn');btn.disabled=true;btn.textContent='FORGING...';document.getElementById('statusText').textContent='RUNNING';renderAgents('running');document.getElementById('slipOutput').innerHTML=`<div style="padding:40px;text-align:center">Scanning LIVE ${cur}...</div>`;try{const r=await fetch('/api/v1/generate-slips-live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sport:cur})});const data=await r.json();slips=data.slips||[];active=0;document.getElementById('ppCount').textContent=data.live_breakdown?.prizepicks_live||0;document.getElementById('oddsCount').textContent=data.live_breakdown?.odds_api_live||0;document.getElementById('edgeVal').textContent=slips.length?`+${slips[0].total_edge}%`:'--';renderAgents('done');document.getElementById('statusText').textContent='DONE';document.getElementById('statusSub').textContent=`${data.live_breakdown?.prizepicks_live} ${cur} lines`;renderSlips();}catch(e){document.getElementById('slipOutput').innerHTML='Error '+e.message;renderAgents('idle');}btn.disabled=false;btn.textContent='GENERATE';}
function renderSlips(){if(!slips.length){document.getElementById('slipOutput').innerHTML=`<div style="padding:20px;text-align:center">No lines for ${cur} - Try NBA</div>`;return;}document.getElementById('slipTabs').innerHTML=slips.map((s,i)=>`<button onclick="active=${i};renderSlips()" style="font-size:11px;padding:6px 12px;border-radius:9999px;border:none;cursor:pointer;background:${i===active?'#fff':'transparent'};color:${i===active?'#000':'#8b96a8'}">${s.slip_id} +${s.total_edge}%</button>`).join('');const slip=slips[active];let html=`<div style="padding:12px 16px;display:flex;justify-content:space-between;background:#0d1a2a;border-bottom:1px solid var(--border)"><div style="font-weight:700">${slip.slip_id} ${slip.sport}</div><div style="color:var(--accent);font-weight:800">+${slip.total_edge}%</div></div><table style="width:100%;border-collapse:collapse"><thead><tr style="font-size:10px;color:var(--dim)"><th style="text-align:left;padding:8px 16px">Player</th><th>Market</th><th>Line</th><th>Pick</th><th>Edge</th></tr></thead><tbody>`;slip.picks.forEach(p=>{html+=`<tr style="border-bottom:1px solid rgba(26,42,62,0.5)"><td style="padding:10px 16px"><div style="font-weight:600">${p.player}</div><div style="font-size:10px;color:var(--dim)">${p.team} ${p.sport}</div></td><td style="padding:8px;font-size:12px">${p.market}</td><td style="padding:8px;font-weight:600">${p.line}</td><td style="padding:8px"><span style="padding:3px 8px;border-radius:9999px;background:var(--accent);color:#000;font-weight:700;font-size:11px">${p.pick}</span></td><td style="padding:8px;color:var(--accent);font-weight:700">+${p.edge}%</td></tr>`});html+=`</tbody></table>`;document.getElementById('slipOutput').innerHTML=html;}
renderAgents('idle');fetchStatus();
</script></body></html>
